[package]
name = "builder_tag_registry"
version = "0.1.0"
edition = "2021"
publish = false
description = "Builder tag registry primitive for Kitewell — attaches deduplicated tags to builder addresses"

[workspace]

[lib]
crate-type = ["rlib"]
doctest = false

[dependencies]
soroban-sdk = "28.0.0-rc.2"

[dev-dependencies]
soroban-sdk = { version = "28.0.0-rc.2", features = ["testutils"] }
