[package]
name = "rename-cooldown"
version = "0.1.0"
edition = "2021"
publish = false
description = "Enforces a minimum ledger-sequence cooldown between renames of registered entries"

[lib]
crate-type = ["rlib"]
doctest = false

[dependencies]
soroban-sdk = "28.0.0-rc.2"

[dev-dependencies]
soroban-sdk = { version = "28.0.0-rc.2", features = ["testutils"] }

